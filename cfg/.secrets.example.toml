# Template for cfg/.secrets.toml -- machine-local overrides and anything secret.
# dynaconf loads it after settings.toml, so every key here overrides the tracked
# default. It is git-ignored; this .example copy is the only one in the repo.
#
#     cp cfg/.secrets.example.toml cfg/.secrets.toml
#
# then uncomment and fill in what this host needs. Everything is optional --
# leave a section commented out to keep the settings.toml default.

[auth]
# JWT signing key. The tracked settings.toml ships a placeholder and only runs
# with it while auth.dev_mode = true. For a real deployment, generate a key and
# paste it here, then set dev_mode = false (here or in settings.toml):
#
#     python -m lumi.api.manage gen-secret
#
# secret_key = "paste-the-generated-key-here"
# dev_mode = false

# Turn auth off for local work -- never commit this to settings.toml.
# enabled = false

# First admin account, created when the user database is empty. Prefer leaving
# this unset and running: python -m lumi.api.manage create-user <name> --role admin
# default_admin_password = ""

[rabbitmq]
# The lab broker address, on the host that actually talks to the chamber.
# host = "192.0.2.10"
