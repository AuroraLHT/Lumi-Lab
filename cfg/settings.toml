[api]
host = "0.0.0.0"
port = 8000
workers = 10

[rheed]
exchange = "RHEED"
exchange_type = "direct"

[rheed.pylon]
height = 540
width = 720
fps = 30
name = "Pylon Cam"
[rheed.webcam]
fps = 30
height = 480
width = 640
name = "Web Cam"

[rheed.testcam]
fps = 30
height = 540
width = 720
source = "src/lumi/rheed/assets/test_frame.npy"
name = "Test Cam"

[rheed.video_compressor]
fps = 60
frames_per_keyframe = 1
