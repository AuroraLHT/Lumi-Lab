[pascal]
exchange = "CHAMBER"
exchange_type = "direct"
mi_mode_folder = "mi_mode"
chamber_log_folder = "chamber_log"

[pascal.log_reader]
idle_time = 0.01
queue_size = 10
name = "log_reader"

[pascal.log_reader.test]
