[rabbitmq]
# localhost, so nothing reaches real equipment by default. The lab broker is a
# machine-local fact, not a project-wide one: point at it with `--host` (every node
# and the MCP server take one) or override this in cfg/.secrets.toml on the host
# that actually talks to the chamber.
host = "localhost"

[api]
host = "0.0.0.0"
port = 8000
workers = 10

[auth]
# false = run the backend wide open: the /ws token check is skipped and every
# connection is treated as an administrator. Anyone who can reach this host can
# then drive the equipment. Keep this `true` here -- this file is tracked in git
# and a committed `false` is one merge away from being deployed. To turn auth off
# on your own machine, override it in cfg/.secrets.toml (git-ignored) instead:
#
#     [auth]
#     enabled = false
#
# Setting this false also seeds an "anonymous" user row (id 0) in the user database,
# because per-user UI settings are a foreign key onto users(id) and the wide-open
# identity would otherwise have nothing to point at. That row is created inactive and
# with a random password, so it can never be logged into and a token minted while auth
# was off still stops working once auth is back on. With auth enabled the row is never
# created -- this switch is the only thing that gates it.
enabled = true

# dev_mode = true permits the placeholder secret_key below. In production, set a
# real key in cfg/.secrets.toml (or DYNACONF_AUTH__SECRET_KEY) and set this to
# false -- the backend then refuses to start while the placeholder is still in
# use. Generate one with: python -m lumi.api.manage gen-secret
dev_mode = true
secret_key = "dev-only-insecure-key-change-me"

access_token_expire_minutes = 720  # 12 hours
database_path = "cfg/users.db"

# Bootstraps a first admin account when the user database is empty. Leave the
# password empty in production and create accounts explicitly with:
#   python -m lumi.api.manage create-user <name> --role admin
default_admin_username = "admin"
default_admin_password = ""

[mcp]
# Registered MCP clients and their refresh tokens, for the HTTP transport's login
# flow (lumi.mcp.oauth). Its own file rather than extra tables in the user
# database, so the MCP server and the api node never contend for SQLite's
# database-wide write lock. Unset means "next to auth.database_path", which keeps
# a simulation stack's grants inside run/simulation/ with the rest of its state.
# oauth_database_path = "cfg/mcp_oauth.db"

