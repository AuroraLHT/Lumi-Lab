# How long to wait for an MI script to report completion, in seconds. **0 means wait
# indefinitely**, and that is the default because it is what the controller actually
# does: a command without an explicit `(Nowait)` stays RUNNING until the firmware
# confirms the *physical* goal. `Temperature Set 700` completes when the substrate is at
# 700 -- 24 minutes at 20 degC/min -- and a superlattice loop can run for hours. There is
# no deadline that is both generous enough for those and short enough to be worth having,
# and a bounded one made every `to_temperature()` fail.
#
# What that gives up, so it is a choice and not an accident: the completion update is a
# single lossy message, and neither the firmware nor this codebase can cancel a running
# script (see docs/TODO.md), so a lost update parks the waiting op until the node is
# restarted. `MiCommandRunner` logs every 5 minutes while an unbounded wait is
# outstanding, which is the only signal that this has happened.
#
# Set a number here (or `nodes/experiment.py --mi-timeout N`) to bound it again. Note a
# timeout does not *stop* anything: on expiry the script keeps running on the chamber and
# the node merely stops listening.
mi_command_timeout = 0

# Fail an op when the chamber reports its MI script `aborted`? Default true. The PASCAL
# firmware writes the `Aborted_*` assist file for some scripts that actually ran to
# completion (a known bug), so an op like `to_temperature` -- which issues several MI
# commands in sequence -- can raise on a spurious abort of an early command and never
# send the rest. Set this true only when the caller verifies the physical result another
# way (the chamber log); an aborted script then looks like it succeeded. A deliberate
# `$stop` still fails the op regardless. Override per run with
# `nodes/experiment.py --ignore-mi-abort`.
mi_ignore_abort = false

# PLDChamberConfiguration -- the chamber geometry a growth is planned against.
# Previously copy-pasted into each notebook run and drifted with every physical
# realignment; one source of truth now.
[experiment.pld_config]
center_mask_pos = 100.0
center_rheed_pos = 0.0
plumb_center = 0.0
target_to_mask_distance = 60.16
mask_to_sample_distance = 0.0
rheed_limit = [-3.0, 3.0]
mask_block_position = 75.0

# Hardware bounds previously hardcoded as bare literals inside manager.py method
# bodies (a `< 160` assert, a `[160, 1000]` clamp, a `220` PID-engage special case).
[experiment.bounds]
mask_travel_max = 160.0
temperature_min = 160.0
temperature_max = 1000.0
temperature_pid_engage_threshold = 220.0
warm_up_step = 0.1
warm_up_current_ramp_rate = 0.015
warm_up_wait_interval = 0.2
warm_up_max_waittime = 180.0

# PASCAL target-carousel slot -> chamber-log field name. Chamber-specific; was a
# hardcoded dict (_target_id_mapper) inside BaseExperimentManager.__init__.
[experiment.target_mapper]
A = "TG1name"
B = "TG2name"
C = "TG3name"
D = "TG4name"
E = "TG5name"
F = "TG6name"
Clear = "TG7name"
Monitor = "TG8name"
