[project]
name = "lumi"
version = "0.1.0"
description = "Autonomous PLD and RHEED equipment control"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Haotong Liang", email = "auroralht@gmail.com" },
    { name = "Haotong Liang", email = "hliang16@umd.edu" },
]
# Floor of 3.11: real code uses datetime.UTC and enum.StrEnum (both added in 3.11).
# Capped below 3.12: mmdet hard-requires mmcv<2.2.0, but OpenMMLab only publishes
# prebuilt mmcv<2.2.0 wheels up to cp311 -- see the `detection` extra below and
# scripts/install_detection_deps.sh for the full story. Stopgap until mmdet is
# replaced; lift the cap once it is.
requires-python = ">=3.11,<3.12"

# Core: what every node and every client needs. Deliberately small -- the bus,
# the contract models, config, and arrays. Anything hardware- or role-specific
# belongs in an optional-dependency group below so a detection box does not
# have to install pypylon and the camera host does not have to install CUDA.
dependencies = [
    "aio-pika>=9.4",
    "pydantic>=2.7",
    "dynaconf>=3.2",
    "numpy>=2.0",
]

[project.optional-dependencies]
# RHEED / chamber camera acquisition and video encoding.
camera = [
    "opencv-python>=4.9",
    "av>=12.0",
    "pypylon>=4.0",       # Basler GigE; only needed on the host with the pylon camera
]
# Pascal chamber: log/config file watching and log parsing.
pascal = [
    "watchdog>=4.0",
    "pandas>=2.2",
]
# HDF5 recorder.
storage = [
    "h5py>=3.11",
    "pandas>=2.2",
]
# FastAPI / websocket bridge, plus the auth stack: a SQLite user store, bcrypt
# password hashing, and JWT bearer tokens. python-multipart is required by
# FastAPI's OAuth2PasswordRequestForm (the /auth/login form parser).
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
]
# Detection model. NOT resolvable from PyPI alone: `rhana` is an internal package
# and the mmdet/mmcv stack is version-coupled to the installed torch+CUDA build,
# which uv cannot pin portably -- it also forces numpy<2 in this venv (torch2.1.0
# predates NumPy 2.0) despite the numpy>=2.0 floor above, and requires the
# requires-python<3.12 cap above it. Run scripts/install_detection_deps.sh on the
# detection host instead of adding these to this list (see that script's header
# for exactly what it runs and why).
# The detection *contract* and its generated client have no such requirement --
# only the node process that actually loads the model does.
detection = [
    "scikit-image>=0.23",
    "pillow>=10.3",
]
# Experiment driver: substrate/project/growth provenance in a local SQLite database.
experiment = [
    "aiosqlite>=0.20",
]
# Bayesian optimisation over growth conditions, for the closed-loop notebooks.
# Split out because torch + gpytorch are a heavy install that only whichever machine
# runs the BO notebook needs -- the chamber and camera hosts never import this.
# Deliberately not pinned alongside `detection`: that extra's torch comes from
# scripts/install_detection_deps.sh with a CUDA build, and pinning one here would
# fight it on a host that has both.
opt = [
    "torch>=2.2",
    "gpytorch>=1.11",
    "pandas>=2.2",
]
# The MCP server that exposes the experiment node's ops as tools for an LLM agent.
# A separate extra from `experiment` itself: the node needs aiosqlite, the MCP
# server (a distinct process) needs the SDK, and neither host has to install both.
# uvicorn/bcrypt/pyjwt/aiosqlite are here (duplicating parts of `api`) because the
# HTTP transport verifies bearer tokens against the same JWT/user store the browser
# bridge uses (lumi.api.db/security) and serves over uvicorn -- this extra has to be
# self-sufficient on a host that never installs `api`.
mcp = [
    "mcp>=1.0",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
]
# Plotting for notebooks/*.ipynb -- both SingleDeposition and BODeposition import
# matplotlib.pyplot directly. Split out because no node process needs it; only
# whichever machine runs a notebook does.
notebooks = [
    "matplotlib>=3.8",
]

[project.scripts]
lumi-codegen = "lumi.codegen.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "testcontainers[rabbitmq]>=4.5",
    "httpx>=0.27",       # required by fastapi.testclient for the bridge tests
    "websockets>=12",    # ASGI websocket driver for TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "broker: requires a live RabbitMQ (spun up via testcontainers; slow)",
    "hardware: requires real lab hardware (camera, chamber); never runs in CI",
]
# The legacy tests/ tree is a pile of `__main__` integration scripts, not a suite,
# and most of them import torch/cv2/pypylon at module scope. tests/conftest.py
# quarantines them via collect_ignore; entries are removed there as they are ported.
