
<!DOCTYPE html>
<html>
  <head>
    <title>WebSocket MP4 Stream</title>

    <style>
        .video-container {
            position: relative;
            display: inline-block;
        }

        video {
            display: block;
        }

        #svg-detection {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Ignore pointer events on SVG */
        }

        rect {
            pointer-events: auto; /* Enable pointer events on rectangles */
        }

        .tooltip {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 5px;
            border-radius: 3px;
            pointer-events: none;
            display: none;
        }

        #storageForm {
            display: flex; /* Makes the form a flex container */
            align-items: center; /* Vertically centers form elements */
        }
        #storageForm label {
            margin-right: 10px; /* Adds space between label and next element */
        }
        #storageForm input[type="text"], form textarea, form input[type="checkbox"] {
            margin-right: 20px; /* Adds space between form fields */
        }
        #response {
            margin-left: 20px; /* Adds space between the form and the response message */
        }

    </style>

  </head>
  <body>
    <label for="video_src">Choose the video src:</label>

    <select id="video_src">
      <option value="">""</option>
      <option value="127.0.0.1:8000">localhost</option>
      <option value="10.229.54.118:8000">lab</option>
    </select>

    <br/>
    <br/>
    <br/>
    <br/>
    <br/>
    <div class="video-container">
        <video id="video" controls autoplay="true">
            Your browser does not support the video tag.
        </video>
        <svg id="svg-detection" xmlns="http://www.w3.org/2000/svg">
            <!-- <rect class="bbox" id="box1" x="50" y="50" width="100" height="100" fill="none" stroke="red" stroke-width="2" />
            <rect class="bbox" id="box2" x="200" y="100" width="150" height="150" fill="none" stroke="blue" stroke-width="2" />
            <rect class="bbox" id="box3" x="400" y="200" width="100" height="50" fill="none" stroke="green" stroke-width="2" /> -->
        </svg>
        <div class="tooltip" id="tooltip"></div>
    </div>
    <br />
    <button id="button-close">Close</button>
    <button id="button-msg">Message</button>
    <button id="button-live">Live</button>
    <button id="button-detection">Detect</button>    
    <button id="button-detection-close">Close Detect</button>    
    <button id="button-log">Log</button>    
    <button id="button-log-close">Close Log</button>    

    <br>
    <form id="storageForm">
        <label for="project_name">Project Name:</label>
        <input type="text" id="project_name" name="project_name" required><br><br>

        <label for="save_frame">Save Frame:</label>
        <input type="checkbox" id="save_frame" name="save_frame" value=true><br><br>

        <label for="save_ai">Save AI:</label>
        <input type="checkbox" id="save_ai" name="save_ai" value=true><br><br>

        <label for="save_log">Save Log:</label>
        <input type="checkbox" id="save_log" name="save_log" value=true><br><br>

        <button type="submit">Start</button>
    </form>
    <button id="button-storage-end">End</button>

    <div id="storage-response"></div>

    <br>
    <h1>Server-Sent Events Display</h1>

    <div style="display: flex; justify-content: space-between;">
        <ul id="detection-node-events" style="flex: 1; margin: 0 10px;"></ul>
        <ul id="cam-node-events" style="flex: 1; margin: 0 10px;"></ul>
        <ul id="log-node-events" style="flex: 1; margin: 0 10px;"></ul>
    </div>

    <pre id="response"></pre>

    <script>
      let tmp = null;
      (async () => {  
        // helper for adding rect
        function correct_bbox(bbox_xyxy, crop_setup){
          if (crop_setup === null) {
              crop_setup = {
                "sx" :0, "sy": 0,
              };
            }
            bbox_xyxy = [...bbox_xyxy];
            bbox_xyxy[0] = bbox_xyxy[0] + crop_setup['sy'];
            bbox_xyxy[1] = bbox_xyxy[1] + crop_setup['sx'];
            bbox_xyxy[2] = bbox_xyxy[2] + crop_setup['sy'];
            bbox_xyxy[3] = bbox_xyxy[3] + crop_setup['sx'];
            return bbox_xyxy;
        }

        function updateRect(rect, bbox_xyxy){

            x = bbox_xyxy[0];
            y = bbox_xyxy[1];
            w = bbox_xyxy[2] - bbox_xyxy[0];
            h = bbox_xyxy[3] - bbox_xyxy[1];
            // console.log(bbox_xyxy);
            rect.setAttribute('x', x);
            rect.setAttribute('y', y);
            rect.setAttribute('width', w);
            rect.setAttribute('height', h);
            
        }

        function removeRect(rectToRemove) {
            if (rectToRemove) {
                svg.removeChild(rectToRemove);
            } else {
                alert(`No rectangle found to remove`);
            }
        }

        function addRect(id, svg, bbox_xyxy) {
            x = bbox_xyxy[0];
            y = bbox_xyxy[1];
            w = bbox_xyxy[2] - bbox_xyxy[0];
            h = bbox_xyxy[3] - bbox_xyxy[1];

            const newRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            newRect.setAttribute('id', `box${id}`);
            newRect.setAttribute('class', `bbox`);
            newRect.setAttribute('x', x);
            newRect.setAttribute('y', y);
            newRect.setAttribute('width', w);
            newRect.setAttribute('height', h);
            newRect.setAttribute('fill', 'none');
            newRect.setAttribute('stroke', 'purple');
            newRect.setAttribute('stroke-width', 2);
            newRect.setAttribute('data-original-stroke', 'purple');
            svg.appendChild(newRect);
        }
        // const host = "10.229.54.118:8000"
        // const host = "127.0.0.1:8000"

        function waitForSelection() {
            return new Promise((resolve) => {
                document.getElementById("video_src").addEventListener("change", function() {
                    var selectedValue = this.value;
                    resolve(selectedValue);
                }, { once: true });
            });
        }
        await waitForSelection();

        const get_host = () => { var element = document.getElementById("video_src"); console.log(element.value); return element.value };
        var host = get_host();
        const videoElement = document.getElementById("video");
        const buttonElement = document.getElementById("button-close");
        const msgElement = document.getElementById("button-msg");

        const liveElement = document.getElementById("button-live");

        const detectionElement = document.getElementById("button-detection");
        const detectionCloseElement = document.getElementById("button-detection-close");
        const detectionSvgElement = document.getElementById("svg-detection");

        const logElement = document.getElementById("button-log");
        const logCloseElement = document.getElementById("button-log-close");

        const storageCloseElement = document.getElementById("button-storage-end");

        const websocket = new WebSocket(`ws://${host}/RHEED/cam/live`);
        websocket.binaryType = "arraybuffer";

        const websocket_ai = new WebSocket(`ws://${host}/RHEED/detection/live`);
        websocket_ai.binaryType = "arraybuffer";

        const websocket_log = new WebSocket(`ws://${host}/chamber/log/live`);


        var mediaSource = new MediaSource();
        videoElement.src = URL.createObjectURL(mediaSource);

        var content;
        let queue = [];

        // Video that will be fetched and appended
        // const remoteVidUrl = `https://raw.githubusercontent.com/chromium/chromium/b4b3566f27d2814fbba1b115639eb7801dd691cf/media/test/data/bear-vp9-opus.webm`;
        // const remoteVidUrl = `http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4`
        const remoteVidUrl = `https://nickdesaulniers.github.io/netfix/demo/frag_bunny.mp4`;

        // Fetch remote URL, getting contents as binary blob
        // content = await fetch(remoteVidUrl, {
        //     mode: 'cors', // Ensure CORS mode
        // });
        // const vidBlob = await content.blob();

        // // We need array buffers to work with media source
        // const vidBuff = await vidBlob.arrayBuffer();

        mediaSource.addEventListener("sourceopen", () => {
          // console.log("source open")
          // const sourceBuffer = mediaSource.addSourceBuffer(`video/webm; codecs="vp9,opus"`);
          // sourceBuffer.appendBuffer(vidBuff);

          // https://stackoverflow.com/questions/16363167/html5-video-tag-codecs-attribute
          // avc1.4D401E, avc1 indicates H.264 video, and this is followed by a dot and three 2-digit hexadecimal numbers defined by the H.264 standard:
          // As for mp4a.40.2, mp4a indicates MPEG-4 audio. It is followed by a dot and a hexadecimal ObjectTypeIndication (objectTypeId in mp4file output), which can be looked up on the MPEG4 registration site.
          // sourceBuffer = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.42E01E, mp4a.40.2"');
          sourceBuffer = mediaSource.addSourceBuffer(
            'video/mp4; codecs="avc1.42E01E"'
          );
          
          // try h.265 encoding if possible
          // sourceBuffer = mediaSource.addSourceBuffer(
          //   'video/mp4; codecs="hvc1.1.6.L93.B0"'
          // );

          

          // console.log("online download content", vidBuff)
          // sourceBuffer.appendBuffer(vidBuff);

          websocket.onmessage = (event) => {
            // const content = new Uint8Array(event.data);
            // content = event.data;
            // console.log(event.data.byteLength);
            // Check if the MediaSource is still open
            if (mediaSource.readyState === "open") {
              // Append the received data to the SourceBuffer
              // sourceBuffer.appendBuffer(vidBuff);
              // sourceBuffer.appendBuffer(content);
              // console.log("add to queue");
              queue.push(event.data);
              // sourceBuffer.appendBuffer(event.data);

              if (queue.length > 0 && !sourceBuffer.updating) {
                content = queue.shift();
                // console.log("append", content.byteLength);
                sourceBuffer.appendBuffer(content);
              }
            } else {
              console.log(
                "Media source is not in open state: ",
                mediaSource.readyState
              );
            }
          };

          sourceBuffer.addEventListener("updateend", () => {
            // If the video element is not already playing, start playing it
            // total_array = []
            if (queue.length > 0 && !sourceBuffer.updating) {
              content = queue.shift();
              // console.log("append", content.byteLength);
              sourceBuffer.appendBuffer(content);
            }
            // while (queue.length > 0) {
            //     sourceBuffer.appendBuffer(queue.shift());
            //     // total_array = total_array.concat( queue.shift() )
            // }
            // sourceBuffer.appendBuffer(total_array);

            // if (videoElement.paused) {
            //     videoElement.play();
            //     // hide the not connected message
            //     // notConnectedMessage.style.display = 'none';
            // }
          });

          sourceBuffer.addEventListener("error", (event) => {
            console.error("SourceBuffer error:", event);
          });
        });

        console.log("create media source and start streaming");

        websocket.onopen = () => {
            console.log("websocket open");
            // websocket.send("init"); // tell the server to send initialization value
            
            websocket.send("start_streaming"); // tell the server to send initialization value
            websocket.send("start_server"); // tell the server to start streaming

        };
        websocket.onclose = () => {
          console.log("websocket close");
          if (mediaSource.readyState === "open") {
            mediaSource.endOfStream();
          }
        };

        websocket.onerror = (error) => {
          console.error("WebSocket error:", error);
          if (mediaSource.readyState === "open") {
            mediaSource.endOfStream();
          }
          websocket.close();
        };

        websocket_ai.onmessage = (event) => {
            // const response = JSON.parse(event.data);

            const arrayBuffer = event.data;

            // Read the header length (4 bytes)
            const headerLength = new DataView(arrayBuffer, 0, 4).getUint32(0);

            // Read the header JSON
            const headerJson = new TextDecoder().decode(arrayBuffer.slice(4, 4 + headerLength));
            const header = JSON.parse(headerJson);

            const payloadJson = new TextDecoder().decode(arrayBuffer.slice(4 + headerLength));
            const payload = JSON.parse(payloadJson);            
            
            // console.log(header, typeof(header));
            // console.log(payload, typeof(payload));

            var bboxes = payload['bboxes'];

            var rects = document.getElementsByClassName("bbox");

            let crop_setup = ('crop_setup_sx' in header)? {"sx": header['crop_setup_sx'], "sy": header['crop_setup_sy'], "ex": header['crop_setup_ex'], "ey": header['crop_setup_ey'],} : null
            // let crop_setup = ('crop_setup' in header)? header['crop_setup'] : null

            for (let i = 0; i < rects.length; i++){
                let rect = rects[i];
                if (rect.id.substring(3) in bboxes){
                    let bbox = bboxes[i]['bbox'];
                    bbox = correct_bbox(bbox, crop_setup)
                    updateRect(rect, bbox);
                }else{
                    removeRect(rect);
                };                
            }
            
            var rects = document.getElementsByClassName("bbox")
            let bboxes_keys = Object.keys(bboxes);
            for (let i = 0; i < bboxes_keys.length; i++){
                let key = bboxes_keys[i];
                if (key >= rects.length) {
                    let bbox = bboxes[key]['bbox']
                    bbox = correct_bbox(bbox, crop_setup)
                    addRect(key, detectionSvgElement, bbox);
                }
            }


            // document.getElementById('response').textContent = JSON.stringify(response, null, 2);
        };

        // document.getElementById('sendButton').addEventListener('click', () => {
        //     const message = {
        //         action: 'greet',
        //         timestamp: new Date().toISOString()
        //     };
        //     socket.send(JSON.stringify(message));
        // });

        websocket_ai.onerror = (error) => {
            console.error('WebSocket error:', error);
        };

        websocket_ai.onclose = () => {
            console.log('Detection WebSocket connection closed');
        };


        websocket_log.onmessage = (event) => {
            const response = JSON.parse(event.data);
            document.getElementById('response').textContent = JSON.stringify(response, null, 2);
        };

        // document.getElementById('sendButton').addEventListener('click', () => {
        //     const message = {
        //         action: 'greet',
        //         timestamp: new Date().toISOString()
        //     };
        //     socket.send(JSON.stringify(message));
        // });

        websocket_log.onerror = (error) => {
            console.error('WebSocket error:', error);
        };

        websocket_log.onclose = () => {
            console.log('Log WebSocket connection closed');
        };


        videoElement.addEventListener("error", (error) => {
          console.error("Video element error:", error);
        });


        buttonElement.onclick = (event) => {
          console.log("Close BTN");
          websocket.close();
        };
        msgElement.onclick = (event) => {
          console.log("Message BTN");
          websocket.send("message.");
        };

        liveElement.onclick = (event) => {
          console.log("Live BTN");
          videoElement.currentTime = videoElement.duration - 0.05;
        };

        detectionElement.onclick = (event) => {
            console.log("Detection");
            websocket_ai.send("start");
        }

        detectionCloseElement.onclick = (event) => {
            console.log("Detection Close");
            websocket_ai.send("stop");
        }

        logElement.onclick = (event) => {
            console.log("Log");
            websocket_log.send("start");
        }

        logCloseElement.onclick = (event) => {
            console.log("Log Close");
            websocket_log.send("stop");
        }
        // console.log((vidBuff))

        storageCloseElement.onclick = async (event) => {
            console.log("Storage Close");
            try {
                const response = await fetch(`http://${host}/storage/end`, { // Replace with your server endpoint
                    method: 'POST',
                    body: JSON.stringify({}),
                    headers: {
                      'Content-Type': 'application/json', // need this to indicate it is a json. pydantic read this field
                    },
                });


                if (response.ok) {
                    const result = await response.json();
                    document.getElementById('storage-response').innerHTML = `<p>Project ended successfully! Response: ${result['msg']}</p>`;
                } else {
                    const result = await response.json();
                    document.getElementById('storage-response').innerHTML = `<p>There was an error ending your project. Please try again. Response: ${result['msg']}</p>`;
                }
            } catch (error) {
                document.getElementById('storage-response').innerHTML = '<p>There was an error ending your project. Please try again.</p>';
            }
        }

        // for svg 
        const svg = document.querySelector('svg');
        const tooltip = document.getElementById('tooltip');

        svg.addEventListener('mouseover', function(event) {
            if (event.target.tagName === 'rect') {
                event.target.setAttribute('stroke', 'yellow');
                tooltip.textContent = `ID: ${event.target.id}`;
                tooltip.style.display = 'block';
                const { left, top } = svg.getBoundingClientRect();
                tooltip.style.left = `${event.clientX - left + 10}px`;
                tooltip.style.top = `${event.clientY - top + 10}px`;
            }
        });

        svg.addEventListener('mousemove', function(event) {
            if (tooltip.style.display === 'block') {
                const { left, top } = svg.getBoundingClientRect();
                tooltip.style.left = `${event.clientX - left + 10}px`;
                tooltip.style.top = `${event.clientY - top + 10}px`;
            }
        });

        svg.addEventListener('mouseout', function(event) {
            if (event.target.tagName === 'rect') {
                event.target.setAttribute('stroke', event.target.getAttribute('data-original-stroke'));
                tooltip.style.display = 'none';
            }
        });

        document.querySelectorAll('rect').forEach(rect => {
            rect.setAttribute('data-original-stroke', rect.getAttribute('stroke'));
        });
        
        // storage form 
        document.getElementById('storageForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent the form from submitting via the browser

            const form = event.target;
            const formData = new FormData(form);

            const body = {};
            formData.forEach((value, key) => {
              body[key] = value;
            });

            try {
                const response = await fetch(`http://${host}/storage/start`, { // Replace with your server endpoint
                    method: 'POST',
                    // body : formData, // does not work with this with this content type
                    body: JSON.stringify(body),
                    headers: {
                      'Content-Type': 'application/json', // need this to indicate it is a json. pydantic read this field
                    },
                });

                if (response.ok) {
                    const result = await response.json();
                    document.getElementById('storage-response').innerHTML = `<p>Project submitted successfully! Response: ${result['msg']}</p>`;
                } else {
                    const result = await response.json();
                    document.getElementById('storage-response').innerHTML = `<p>There was an server side error submitting your project. Please try again. Response: ${result['msg']}</p>`;
                }
            } catch (error) {
                document.getElementById('storage-response').innerHTML = '<p>There was an client side error submitting your project. Please try again.</p>';
            }
      });        


      // SSE
      // DETECTION NODE
        const eventSource_detection = new EventSource(`http://${host}/RHEED/detection/live/state`);

        eventSource_detection.onmessage = function(event) {
            // Parse the JSON data received from the server
            // console.log(event.data);
            const data = JSON.parse(event.data);
            // console.log(data, typeof(data));
            
            // Display the received data
            const listItem = document.createElement("li");
            const text = Object.entries(data).map(([key, value]) => `${key}: ${value}`).join(', ');
            listItem.innerText = text;
            // console.log(text);
            const detectionNodeEvents = document.getElementById("detection-node-events");
            detectionNodeEvents.innerHTML = ''; // Clear existing content
            detectionNodeEvents.appendChild(listItem);
        };

        eventSource_detection.onerror = function(error) {
            console.error("EventSource failed:", error);
            eventSource_detection.close();
        };
        // CAM NODE
        const eventSource_cam = new EventSource(`http://${host}/RHEED/cam/live/state`);

        eventSource_cam.onmessage = function(event) {
            // Parse the JSON data received from the server
            console.log(event.data);
            const data = JSON.parse(event.data);
            console.log(data, typeof(data));
            
            // Display the received data
            const listItem = document.createElement("li");
            const text = Object.entries(data).map(([key, value]) => `${key}: ${value}`).join(', ');
            listItem.innerText = text;
            console.log(text);
            const camNodeEvents = document.getElementById("cam-node-events");
            camNodeEvents.innerHTML = '';  // Clear existing content
            camNodeEvents.appendChild(listItem);
        };

        eventSource_cam.onerror = function(error) {
            console.error("EventSource failed:", error);
            eventSource_cam.close();
        };

      // LOG NODE
      const eventSource_log = new EventSource(`http://${host}/chamber/log/live/state`);

      eventSource_log.onmessage = function(event) {
          // Parse the JSON data received from the server
          console.log(event.data);
          const data = JSON.parse(event.data);
          console.log(data, typeof(data));
          
          // Display the received data
          const listItem = document.createElement("li");
          const text = Object.entries(data).map(([key, value]) => `${key}: ${value}`).join(', ');
          listItem.innerText = text;
          console.log(text);
          const logNodeEvents = document.getElementById("log-node-events");
          logNodeEvents.innerHTML = '';  // Clear existing content
          logNodeEvents.appendChild(listItem);
      };

      eventSource_log.onerror = function(error) {
          console.error("EventSource failed:", error);
          eventSource_log.close();
      };

      })();
    </script>
  </body>
</html>
